name: Build Flashable ROM & Upload GitHub Releases & GoFile

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Stock ROM Download Link (SourceForge, Needrom, Google Drive, Mega, PixelDrain, GoFile, MediaFire, Direct Link)'
        required: true
        type: string
      device_name:
        description: 'Device Name (e.g., Infinix GT 20 Pro)'
        required: true
        type: string
      codename:
        description: 'Device Codename (e.g., X6871)'
        required: true
        type: string
      fw_version:
        description: 'Firmware Version (e.g., X6871-15.1.2.145SP02(OP001PF001AZ))'
        required: true
        type: string
      region:
        description: 'Region Subfolder Name (e.g., Open, India)'
        required: true
        type: string
      zstd_lvl:
        description: 'Zstandard Compression Level (3 = Fast/Recommended 3-min, 6 = Balanced, 19 = Maximum Ultra)'
        required: false
        default: '3'
        type: choice
        options:
          - '3'
          - '6'
          - '19'
      needrom_cookie:
        description: 'Needrom Session/CF Cookie (Optional)'
        required: false
        type: string
      needrom_user:
        description: 'Needrom Username (Optional)'
        required: false
        type: string
      needrom_pass:
        description: 'Needrom Password (Optional)'
        required: false
        type: string
      gofile_token:
        description: 'GoFile Token (Optional)'
        required: false
        type: string

jobs:
  build:
    name: Build & Publish Flashable ROM
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Set Binary Permissions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full aria2 curl zstd
          chmod -R +x bin/

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --no-cache-dir gdown requests mega.py

      - name: Download Stock ROM
        env:
          NEEDROM_USER: ${{ inputs.needrom_user || secrets.NEEDROM_USER }}
          NEEDROM_PASS: ${{ inputs.needrom_pass || secrets.NEEDROM_PASS }}
          NEEDROM_COOKIE: ${{ inputs.needrom_cookie || secrets.NEEDROM_COOKIE }}
        run: |
          python download_rom.py "${{ inputs.rom_url }}" "work/stock_rom_archive" "${{ inputs.needrom_user }}" "${{ inputs.needrom_pass }}" "${{ inputs.needrom_cookie }}"

      - name: Extract Stock ROM Archive
        run: |
          mkdir -p work/extracted_rom
          7z x "work/stock_rom_archive" -owork/extracted_rom -y -mmt=on

      - name: Build Recovery Flashable ROM (Zstd Compression Level ${{ inputs.zstd_lvl || '3' }})
        run: |
          python build_cli.py --base-dir "work/extracted_rom" --out-dir "output" --device "${{ inputs.device_name }}" --codename "${{ inputs.codename }}" --fw-ver "${{ inputs.fw_version }}" --region "${{ inputs.region }}" --zstd-lvl "${{ inputs.zstd_lvl || '3' }}"

      - name: Prepare Multi-Part Release Chunks for GitHub (Under 2GB API Limit)
        run: |
          mkdir -p release_chunks
          ZIP_FILE=$(find output -maxdepth 1 -name "*.zip" | head -n 1)
          ZIP_NAME=$(basename "$ZIP_FILE")
          echo "Splitting $ZIP_NAME into 1900MB parts for GitHub Release..."
          split -d -b 1900M "$ZIP_FILE" "release_chunks/${ZIP_NAME}.part"

      - name: Upload Single Full ROM to GoFile Mirror
        env:
          GOFILE_TOKEN: ${{ inputs.gofile_token || secrets.GOFILE_TOKEN }}
        run: |
          ZIP_FILE=$(find output -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
              python gofile_uploader.py "$ZIP_FILE" "${GOFILE_TOKEN}" || true
          fi

      - name: Create GitHub Release & Upload Multi-Part Package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rom-${{ inputs.codename }}-${{ github.run_number }}
          name: "Flashable ROM - ${{ inputs.device_name }} (${{ inputs.codename }})"
          body: |
            ## 🚀 Recovery Flashable ROM Package
            - **Device**: `${{ inputs.device_name }}`
            - **Codename**: `${{ inputs.codename }}`
            - **Firmware Version**: `${{ inputs.fw_version }}`
            - **Region**: `${{ inputs.region }}`
            - **Build Status**: `✓ 100% Complete`
            
            ### 📦 How to Reassemble Parts (GitHub Releases)
            - **Linux / Android / Termux**: `cat *.part* > ROM.zip`
            - **Windows Command Prompt**: `copy /b *.part* ROM.zip`
            - **7-Zip / WinRAR**: Right click `.part00` -> Extract Here.
          files: release_chunks/*.part*
