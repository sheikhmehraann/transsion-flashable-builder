name: Build Flashable ROM & Upload Cloud Mirrors

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Stock ROM Download Link (SourceForge, Needrom, Google Drive, Mega, PixelDrain, GoFile, MediaFire, Direct Link)'
        required: true
        type: string
      device_name:
        description: 'Device Name (e.g., Infinix GT 20 Pro)'
        required: true
        type: string
      codename:
        description: 'Device Codename (e.g., X6871)'
        required: true
        type: string
      fw_version:
        description: 'Firmware Version (e.g., X6871-15.1.2.145SP02(OP001PF001AZ))'
        required: true
        type: string
      region:
        description: 'Region Subfolder Name (e.g., Open, India)'
        required: true
        type: string
      zstd_lvl:
        description: 'Zstandard Compression Level (3 = Fast/Recommended 3-min, 6 = Balanced, 19 = Maximum Ultra)'
        required: false
        default: '3'
        type: choice
        options:
          - '3'
          - '6'
          - '19'
      needrom_cookie:
        description: 'Needrom Session/CF Cookie (Optional)'
        required: false
        type: string
      needrom_user:
        description: 'Needrom Username (Optional)'
        required: false
        type: string
      needrom_pass:
        description: 'Needrom Password (Optional)'
        required: false
        type: string
      gofile_token:
        description: 'GoFile Token (Optional - attaches to account for permanent free storage)'
        required: false
        type: string
      hf_repo:
        description: 'Hugging Face Permanent Dataset Repo (Optional e.g. username/rom-storage)'
        required: false
        type: string
      hf_token:
        description: 'Hugging Face User Access Token (Optional for 100% free permanent storage)'
        required: false
        type: string

jobs:
  build:
    name: Build & Publish Flashable ROM
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Set Binary Permissions
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full aria2 curl zstd
          chmod -R +x bin/

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown requests mega.py huggingface_hub

      - name: Download Stock ROM
        env:
          NEEDROM_USER: ${{ inputs.needrom_user || secrets.NEEDROM_USER }}
          NEEDROM_PASS: ${{ inputs.needrom_pass || secrets.NEEDROM_PASS }}
          NEEDROM_COOKIE: ${{ inputs.needrom_cookie || secrets.NEEDROM_COOKIE }}
        run: |
          python download_rom.py "${{ inputs.rom_url }}" "work/stock_rom_archive" "${{ inputs.needrom_user }}" "${{ inputs.needrom_pass }}" "${{ inputs.needrom_cookie }}"

      - name: Extract Stock ROM Archive
        run: |
          mkdir -p work/extracted_rom
          7z x "work/stock_rom_archive" -owork/extracted_rom -y

      - name: Build Recovery Flashable ROM (Zstd Compression Level ${{ inputs.zstd_lvl || '3' }})
        run: |
          python build_cli.py --base-dir "work/extracted_rom" --out-dir "output" --device "${{ inputs.device_name }}" --codename "${{ inputs.codename }}" --fw-ver "${{ inputs.fw_version }}" --region "${{ inputs.region }}" --zstd-lvl "${{ inputs.zstd_lvl || '3' }}"

      - name: Upload Flashable ROM to GoFile
        env:
          GOFILE_TOKEN: ${{ inputs.gofile_token || secrets.GOFILE_TOKEN }}
        run: |
          ZIP_FILE=$(find output -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
              python gofile_uploader.py "$ZIP_FILE" "${GOFILE_TOKEN}" || true
          fi

      - name: Upload Flashable ROM to Hugging Face (100% Free Permanent Unlimited Storage)
        env:
          HF_REPO: ${{ inputs.hf_repo || secrets.HF_REPO }}
          HF_TOKEN: ${{ inputs.hf_token || secrets.HF_TOKEN }}
        run: |
          ZIP_FILE=$(find output -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ] && [ -n "${HF_REPO}" ] && [ -n "${HF_TOKEN}" ]; then
              python hf_uploader.py "$ZIP_FILE" "${HF_REPO}" "${HF_TOKEN}" || true
          fi
