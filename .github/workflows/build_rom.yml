name: Build Flashable ROM & Upload to GoFile

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Stock ROM Download Link (Needrom page/server URL, Mega, Google Drive, PixelDrain, GoFile, SourceForge, Direct Link)'
        required: true
        type: string
      device_name:
        description: 'Device Name (e.g., Infinix GT 20 Pro)'
        required: true
        type: string
      codename:
        description: 'Device Codename (e.g., X6871)'
        required: true
        type: string
      fw_version:
        description: 'Firmware Version (e.g., X6871-15.1.2.165SP05(OP001PF001AZ))'
        required: true
        type: string
      region:
        description: 'Region Subfolder Name (e.g., India)'
        required: true
        type: string
      needrom_cookie:
        description: 'Needrom Session/CF Cookie (Optional - for private/server Needrom links)'
        required: false
        type: string
      needrom_user:
        description: 'Needrom Username (Optional)'
        required: false
        type: string
      needrom_pass:
        description: 'Needrom Password (Optional)'
        required: false
        type: string
      gofile_token:
        description: 'GoFile Token (Optional)'
        required: false
        type: string

jobs:
  build:
    name: Build & Publish Flashable ROM
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Set Binary Permissions
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full aria2 curl zstd
          chmod -R +x bin/

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown requests mega.py

      - name: Download Stock ROM
        env:
          NEEDROM_USER: ${{ inputs.needrom_user || secrets.NEEDROM_USER }}
          NEEDROM_PASS: ${{ inputs.needrom_pass || secrets.NEEDROM_PASS }}
          NEEDROM_COOKIE: ${{ inputs.needrom_cookie || secrets.NEEDROM_COOKIE }}
        run: |
          python download_rom.py "${{ inputs.rom_url }}" "work/stock_rom_archive" "${{ inputs.needrom_user }}" "${{ inputs.needrom_pass }}" "${{ inputs.needrom_cookie }}"

      - name: Extract Stock ROM Archive
        run: |
          mkdir -p work/extracted_rom
          7z x "work/stock_rom_archive" -owork/extracted_rom -y

      - name: Build Recovery Flashable ROM (Ultra Level 19 Zstd & 7z Multi-Thread Compression)
        run: |
          python build_cli.py --base-dir "work/extracted_rom" --out-dir "output" --device "${{ inputs.device_name }}" --codename "${{ inputs.codename }}" --fw-ver "${{ inputs.fw_version }}" --region "${{ inputs.region }}" --zstd-lvl "19"

      - name: Upload Flashable ROM to GoFile
        run: |
          ZIP_FILE=$(find output -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
              python gofile_uploader.py "$ZIP_FILE" "${{ inputs.gofile_token }}"
          else
              echo "Error: No ZIP file found in output directory!"
              exit 1
          fi
