name: Transsion Flashable Builder (GoFile Cloud Stream)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Stock ROM Download Link (SourceForge, Needrom, GDrive, Mega, PixelDrain, GoFile, MediaFire)'
        required: true
        type: string
      device_name:
        description: 'Device Name (e.g., Infinix GT 20 Pro)'
        required: true
        type: string
      codename:
        description: 'Device Codename (e.g., X6871)'
        required: true
        type: string
      fw_version:
        description: 'Firmware Version (e.g., X6871-15.1.2.145SP02(OP001PF001AZ))'
        required: true
        type: string
      region:
        description: 'Region Subfolder Name (e.g., Open, India)'
        required: true
        type: string
      zstd_lvl:
        description: 'Zstd Compression Level (1 = Ultra-Fast 10s, 3 = Balanced, 19 = Maximum)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '3'
          - '6'
          - '19'
      needrom_cookie:
        description: 'Needrom Cookie (Optional)'
        required: false
        type: string
      needrom_user:
        description: 'Needrom Username (Optional)'
        required: false
        type: string
      needrom_pass:
        description: 'Needrom Password (Optional)'
        required: false
        type: string
      gofile_token:
        description: 'GoFile Token (Optional)'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: 🚀 Flashable ROM Pipeline (GoFile Cloud Engine)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 📁 Checkout Source Code
        uses: actions/checkout@v4.2.2

      - name: 🐍 Setup Python 3.11 Environment
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: 🛠️ Install System Toolchain & Binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full aria2 curl zstd
          chmod -R +x bin/

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --no-cache-dir gdown requests mega.py

      - name: ⚡ Multi-Mirror Ultra Download Stock ROM
        env:
          NEEDROM_USER: ${{ inputs.needrom_user || secrets.NEEDROM_USER }}
          NEEDROM_PASS: ${{ inputs.needrom_pass || secrets.NEEDROM_PASS }}
          NEEDROM_COOKIE: ${{ inputs.needrom_cookie || secrets.NEEDROM_COOKIE }}
        run: |
          python download_rom.py "${{ inputs.rom_url }}" "work/stock_rom_archive" "${{ inputs.needrom_user }}" "${{ inputs.needrom_pass }}" "${{ inputs.needrom_cookie }}"

      - name: 🔓 Extract Stock ROM (16-Thread Multi-Engine)
        run: |
          mkdir -p work/extracted_rom
          7z x "work/stock_rom_archive" -owork/extracted_rom -y -mmt=16 -aoa

      - name: ⚙️ Build Recovery Flashable ROM (Zstd Level ${{ inputs.zstd_lvl || '1' }})
        run: |
          python build_cli.py --base-dir "work/extracted_rom" --out-dir "output" --device "${{ inputs.device_name }}" --codename "${{ inputs.codename }}" --fw-ver "${{ inputs.fw_version }}" --region "${{ inputs.region }}" --zstd-lvl "${{ inputs.zstd_lvl || '1' }}"

      - name: ☁️ Stream Upload Flashable ROM to GoFile Cloud
        env:
          GOFILE_TOKEN: ${{ inputs.gofile_token || secrets.GOFILE_TOKEN }}
        run: |
          ZIP_FILE=$(find output -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
              python gofile_uploader.py "$ZIP_FILE" "${GOFILE_TOKEN}"
          else
              echo "Error: No ZIP file found in output directory!"
              exit 1
          fi
